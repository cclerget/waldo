# Candidate rung 0003: preserve TinyStories language behavior while learning
# one bounded knowledge domain: genetics and cell biology.
kind: waldo-model-compose
schema: 1
architecture:
  family: decoder-transformer
  context_tokens: 512
  vocabulary_size: 4096
  hidden_size: 512
  intermediate_size: 1536
  layers: 9
  attention_heads: 8
  key_value_heads: 8
  dropout: 0.2
  qk_normalization: false
  initialization: depth-scaled
  tie_embeddings: true
  parameter_dtype: float32
  tokenizer:
    training:
      algorithm: byte-bpe-v1
      sample_bytes: 134217728
      seed: 42
      max_token_inflation: 0.50
      distribution_policy: distributable
      filter:
        main_content: true
        exclude:
          repetitive_content: true
          boilerplate_content: true
      corpora:
        - core/common-pile/pressbooks
stages:
  - name: cell-biology-pretrain
    type: pre-training
    objective: causal-language-modeling
    filter:
      main_content: true
      exclude:
        repetitive_content: true
        boilerplate_content: true
    corpora:
      - path: science/plos
        weight: 7
        filter:
          metadata:
            journal:
              include: [PLOS Genetics]
      - path: core/common-pile/wikimedia
        weight: 1
        filter:
          metadata:
            wiki:
              include: [wikibooks.com]
            title:
              include:
                - Structural Biochemistry*
                - Handbook of Genetic Counseling*
                - Proteomics*
                - Cell Biology*
                - General Biology*
                - FHSST Biology*
                - Biochemistry*
                - High School Biology*
                - General Genetics*
                - Principles of Biochemistry*
                - Saylor.org's Cell Biology*
                - An Introduction to Molecular Biology*
                - Molecular Cloning*
                - Genetic Information*
      - path: core/synthetic/tinystories-reference
        weight: 2
    parameters:
      profile: causal-pretrain-weighted
      parallelism: auto
      tokens: 2454446080
      batch_size: 12
      gradient_accumulation_steps: 3
      compute_precision: auto
      activation_checkpointing: false
      compile: false
      sequence_length: 512
      learning_rate: 0.0006
      optimizer: adamw
      schedule: cosine
      seed: 42
      weight_decay: 0.1
      warmup_steps: 400
      checkpoint_every: 9987
      evaluate_every: 9987
      shuffle_buffer_records: 32768
      shuffle_buffer_bytes: 1073741824
      evaluation_selection: lowest-sha256-v1
      evaluation_fraction: 0.01
      evaluation_max_records: 512
      evaluation_max_bytes: 16777216
